[package]
name = "pqdif"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust reader for the Power Quality Data Interchange Format (IEEE Std 1159.3)"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[build-dependencies]
xml-rs = "0.8"

[features]
# Off-by-default: exercise the parser against a real .pqd file whose path is
# supplied via the PQDIF_TEST_FILE environment variable. Not run in CI.
real-file-tests = []
